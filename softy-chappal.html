<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Softy Chappal</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <h1>Softy Chappal</h1>

    <img src="new.jpeg" alt="Softy Chappal" width="400">

    <h2>Price: Rs.1999</h2>
    <h3>Total Price: Rs. <span id="totalPrice">1999</span></h3>
    <h3>Quantity</h3>

<button onclick="decreaseQty()">-</button>

<input type="text" id="qty" value="1" readonly style="width:40px; text-align:center;">

<button onclick="increaseQty()">+</button>

    <p><strong>Description:</strong></p>
    <p>Comfortable Softy Chappal for daily use. Premium quality with durable sole.</p>

    <h3>Available Sizes</h3>
    <select id="size">
        <option>39</option>
        <option>40</option>
        <option>41</option>
        <option>42</option>
        <option>43</option>
        <option>44</option>
    </select>

    <br><br>
    <h3>Delivery Details</h3>

<input type="text" id="customerName" placeholder="Your Name"><br><br>

<input type="tel" id="customerPhone" placeholder="Phone Number"><br><br>

<input type="text" id="customerCity" placeholder="City"><br><br>

<textarea id="customerAddress" placeholder="Complete Address"></textarea><br><br>
<button onclick="orderWhatsApp()">Buy Now</button>
<br><br>

    <a href="index.html">
        <button>⬅ Back to Home</button>
    </a>
    <script>
let qty = 1;
const price = 1999;

function updatePrice() {
    document.getElementById("qty").value = qty;
    document.getElementById("totalPrice").innerText = qty * price;
}

function increaseQty() {
    qty++;
    updatePrice();
}

function decreaseQty() {
    if (qty > 1) {
        qty--;
        updatePrice();
    }
}

updatePrice();
</script>

</body>

</html>
