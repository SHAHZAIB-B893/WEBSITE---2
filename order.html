<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Form - Faisal Shoes Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-box">
        <h2>Place Your Order</h2>

        <form>
            <input type="text" placeholder="Full Name" required><br><br>

            <input type="tel" placeholder="Phone Number" required><br><br>

            <input type="text" placeholder="City" required><br><br>

            <textarea placeholder="Complete Address" rows="4" style="width:90%;" required></textarea><br><br>

            <button type="submit">Place Order</button>
        </form>

        <br>

        <a href="index.html">
            <button>⬅ Back to Home</button>
        </a>
    </div>

</body>

</html>
